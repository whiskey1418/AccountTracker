<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Zsammy Admin</title>
<style>
  :root{--bg:#090C12;--card:#111723;--line:#1e2838;--text:#e8eef7;--muted:#8a97ab;--accent:#6effad;--danger:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding:16px;max-width:980px;margin-inline:auto}
  h1{font-size:18px;margin:0 0 12px}
  .box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
  .center{text-align:center;padding:40px 16px}
  button{background:var(--accent);color:#06210f;border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:14px;cursor:pointer}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:600}
  .bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  input,select{background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
  input{flex:1;min-width:160px}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  td.num,th.num{text-align:right}
  .muted{color:var(--muted)}
  .denied{color:var(--danger);font-size:18px;font-weight:700}
  .hidden{display:none}
</style>
</head>
<body>
<h1>Zsammy Admin</h1>

<div id="loading" class="box center muted">Loading…</div>

<div id="login" class="box center hidden">
  <p class="muted">Admin only. Sign in with Google.</p>
  <button id="btnSignIn">Sign in with Google</button>
  <p id="loginErr" class="muted"></p>
</div>

<div id="denied" class="box center hidden">
  <div class="denied">Access denied</div>
  <p class="muted" id="deniedWho"></p>
  <button class="ghost" id="btnDeniedOut">Sign out</button>
</div>

<div id="panel" class="box hidden">
  <div class="bar">
    <input id="q" type="search" placeholder="Search name or email">
    <select id="sort">
      <option value="lastSeen:desc">Last seen (newest)</option>
      <option value="lastSeen:asc">Last seen (oldest)</option>
      <option value="firstLogin:desc">First login (newest)</option>
      <option value="firstLogin:asc">First login (oldest)</option>
      <option value="accountCount:desc">Accounts (most)</option>
      <option value="accountCount:asc">Accounts (least)</option>
      <option value="name:asc">Name (A–Z)</option>
      <option value="email:asc">Email (A–Z)</option>
    </select>
    <button class="ghost" id="btnReload">Refresh</button>
    <button class="ghost" id="btnOut">Sign out</button>
  </div>
  <div id="summary" class="muted" style="margin-bottom:8px"></div>
  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>Name</th><th>Email</th><th>First login</th><th>Last seen</th><th class="num">Accounts</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</div>

<script>
  // Admin email: the real protection is firestore.rules; this check only controls the UI.
  const ADMIN_EMAIL = 'adlawan1410@gmail.com';
  const FIREBASE_CONFIG = {
    apiKey: "AIzaSyCuvBeiKFXy2Q1bprsHxxlNXhqjzPg5-zk",
    authDomain: "zsammy-tracker.firebaseapp.com",
    projectId: "zsammy-tracker",
    appId: "1:958421066350:web:2cdba155623d74b340fc7f"
  };
  const SDK = 'https://www.gstatic.com/firebasejs/10.12.2/';
  const $ = id => document.getElementById(id);
  const show = id => ['loading','login','denied','panel'].forEach(x => $(x).classList.toggle('hidden', x !== id));
  let auth, db, all = [];

  function loadScript(src){
    return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Failed to load ' + src)); document.head.appendChild(s); });
  }
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const ms = t => t && t.toMillis ? t.toMillis() : 0;
  const fmt = t => { const m = ms(t); return m ? new Date(m).toLocaleString([], {year:'numeric',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '—'; };

  async function init(){
    try{
      await loadScript(SDK + 'firebase-app-compat.js');
      await Promise.all([loadScript(SDK + 'firebase-auth-compat.js'), loadScript(SDK + 'firebase-firestore-compat.js')]);
      firebase.initializeApp(FIREBASE_CONFIG);
      auth = firebase.auth(); db = firebase.firestore();
      auth.onAuthStateChanged(onAuth);
    }catch(e){ $('loading').textContent = 'Could not load Firebase: ' + e.message; }
  }

  function isAdmin(u){ return !!u && u.emailVerified && (u.email || '').toLowerCase() === ADMIN_EMAIL; }

  async function onAuth(u){
    if(!u){ show('login'); return; }
    if(!isAdmin(u)){ $('deniedWho').textContent = 'Signed in as ' + (u.email || 'unknown'); show('denied'); return; }
    show('panel');
    load();
  }

  async function load(){
    $('summary').textContent = 'Loading users…';
    try{
      const snap = await db.collection('profiles').get();
      all = snap.docs.map(d => Object.assign({ uid: d.id }, d.data()));
      render();
    }catch(e){
      $('summary').textContent = e.code === 'permission-denied'
        ? 'Firestore rules blocked this. Publish firestore.rules first.'
        : 'Error: ' + e.message;
    }
  }

  function render(){
    const q = $('q').value.trim().toLowerCase();
    const [key, dir] = $('sort').value.split(':');
    let list = all.filter(p => !q || (p.name || '').toLowerCase().includes(q) || (p.email || '').toLowerCase().includes(q));
    const val = p => key === 'lastSeen' || key === 'firstLogin' ? ms(p[key]) : key === 'accountCount' ? (p.accountCount || 0) : String(p[key] || '').toLowerCase();
    list.sort((a, b) => { const x = val(a), y = val(b); const c = x < y ? -1 : x > y ? 1 : 0; return dir === 'asc' ? c : -c; });
    $('summary').textContent = list.length + ' of ' + all.length + ' user' + (all.length === 1 ? '' : 's');
    $('rows').innerHTML = list.length ? list.map(p =>
      '<tr><td>' + esc(p.name || '—') + '</td><td>' + esc(p.email || '—') + '</td><td>' + fmt(p.firstLogin) +
      '</td><td>' + fmt(p.lastSeen) + '</td><td class="num">' + (p.accountCount || 0) + '</td></tr>'
    ).join('') : '<tr><td colspan="5" class="muted">No users found.</td></tr>';
  }

  $('btnSignIn').onclick = async () => {
    $('loginErr').textContent = '';
    try{ await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()); }
    catch(e){ $('loginErr').textContent = e.code === 'auth/unauthorized-domain' ? 'Add this domain in Firebase → Authentication → Settings → Authorized domains.' : (e.message || 'Sign-in failed'); }
  };
  $('btnOut').onclick = $('btnDeniedOut').onclick = () => auth.signOut();
  $('btnReload').onclick = load;
  $('q').oninput = render;
  $('sort').onchange = render;
  init();
</script>
</body>
</html>
